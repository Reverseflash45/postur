name: postur
description: "Deteksi kesalahan postur squat dan push-up dengan pose estimation di Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.4.0
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_mlkit_pose_detection: ^0.16.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  tflite_flutter: ^0.12.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/squat/
    - assets/model/pushup/
    - assets/demo/
