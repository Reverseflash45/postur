name: postur
description: "Deteksi kesalahan postur squat dan push-up dengan pose estimation di Android."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.4.0
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_mlkit_pose_detection: ^0.16.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  tflite_flutter: ^0.12.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/squat/
    - assets/model/pushup/
    - assets/demo/
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/font/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/font/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/font/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Barlow
      fonts:
        - asset: assets/font/Barlow-Regular.ttf
          weight: 400
        - asset: assets/font/Barlow-Medium.ttf
          weight: 500
        - asset: assets/font/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/font/Barlow-Bold.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/font/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/font/IBMPlexMono-Medium.ttf
          weight: 500
